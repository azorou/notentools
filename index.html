<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>NotenApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN / KONTO-ANSICHT (NUR BENUTZERNAME + PASSWORT) -->
<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="app-title">NotenApp</h1>
            <p class="app-sub">Konto mit Benutzername &amp; Passwort</p>
        </div>
        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <div class="auth-field">
                <label for="authUsername">Benutzername</label>
                <input type="text" id="authUsername" autocomplete="username" required placeholder="dein_name">
            </div>
            <div class="auth-field">
                <label for="authPassword">Passwort</label>
                <input type="password" id="authPassword" autocomplete="current-password" required placeholder="Passwort">
            </div>
            <button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">Weiter</button>
            <div id="authStatus" class="hint" style="margin-top:8px;"></div>
        </form>
    </div>
</div>

<!-- HAUPT-APP -->
<div id="appShell" class="app-shell" style="display:none;">
    <header class="topbar">
        <div>
            <h1 class="app-title">NotenApp</h1>
            <p class="app-sub" id="userBadge">Angemeldet</p>
        </div>
        <div class="topbar-actions">
            <button type="button" class="chip-btn" id="installBtn" style="display:none;">Installieren</button>
            <button type="button" class="chip-btn" onclick="cycleTheme()" id="themeBtn">Auto</button>
            <button type="button" class="chip-btn" onclick="handleLogout()">Abmelden</button>
        </div>
    </header>

    <main class="main-content">
        <!-- TAB 1: FÄCHER & GESAMTSCHNITT -->
        <section id="view-subjects" class="tab-view active">
            <div class="hero-summary">
                <div class="hero-metric">
                    <span class="hero-label">Gesamtschnitt</span>
                    <strong class="hero-value" id="overallAvgAll">–</strong>
                    <small class="hero-meta" id="overallMetaAll">Keine Noten</small>
                </div>
                <div class="hero-divider"></div>
                <div class="hero-metric">
                    <span class="hero-label">Vorrückungsfächer</span>
                    <strong class="hero-value accent" id="overallAvgAdv">–</strong>
                    <small class="hero-meta" id="overallMetaAdv">Ohne „Kein Vorrückungsfach“</small>
                </div>
            </div>

            <details class="card-panel" open>
                <summary><span>Vorlagen</span></summary>
                <div class="panel-body">
                    <div class="preset-grid" id="presetSubjectsGrid"></div>
                </div>
            </details>

            <details class="card-panel">
                <summary><span>Eigenes Fach anlegen</span></summary>
                <div class="panel-body">
                    <div class="form-grid-4">
                        <div>
                            <label for="newSubName">Fach</label>
                            <input type="text" id="newSubName" placeholder="z.B. Informatik">
                        </div>
                        <div>
                            <label for="newSubType">Art</label>
                            <select id="newSubType" onchange="toggleNewSubDefaults()">
                                <option value="haupt">Hauptfach</option>
                                <option value="neben">Nebenfach</option>
                            </select>
                        </div>
                        <div>
                            <label for="newSubRatio">Verhältnis</label>
                            <select id="newSubRatio">
                                <option value="2:1">2:1</option>
                                <option value="1:1">1:1</option>
                            </select>
                        </div>
                        <div class="check-col">
                            <label class="checkbox-row">
                                <input type="checkbox" id="newSubNotAdv">
                                <span>Kein Vorrückungsfach</span>
                            </label>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="addSubject()">Fach anlegen</button>
                </div>
            </details>

            <div id="subjectsContainer"></div>
        </section>

        <!-- TAB 2: VERTEILUNG -->
        <section id="view-distribution" class="tab-view">
            <details class="card-panel" open>
                <summary><span>Notenverteilung</span></summary>
                <div class="panel-body">
                    <div class="form-grid-4">
                        <div>
                            <label for="distN">Arbeiten (N)</label>
                            <input type="number" id="distN" min="1" max="60" step="1" placeholder="25" oninput="scheduleDist()">
                        </div>
                        <div>
                            <label for="distAvg">Schnitt (Ø)</label>
                            <input type="text" id="distAvg" placeholder="2,68" oninput="scheduleDist()">
                        </div>
                        <div>
                            <label for="distSigma">Streuung: <strong id="distSigmaVal">1,00</strong></label>
                            <input type="range" id="distSigma" min="0.55" max="1.75" step="0.05" value="1.00" oninput="scheduleDist()">
                        </div>
                        <div>
                            <label for="distKnown">Bekannte Noten</label>
                            <input type="text" id="distKnown" placeholder="312243" oninput="scheduleDist()">
                        </div>
                    </div>

                    <details class="sub-panel">
                        <summary><span>Filter &amp; Bedingungen</span></summary>
                        <div class="sub-panel-body">
                            <div class="form-grid-2" style="margin-bottom:8px;">
                                <div>
                                    <label for="distSkewFilter">Tendenz</label>
                                    <select id="distSkewFilter" onchange="scheduleDist()">
                                        <option value="any">Alle</option>
                                        <option value="light">Eher leicht (1–3)</option>
                                        <option value="balanced">Ausgeglichen</option>
                                        <option value="heavy">Eher schwer (4–6)</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="distSpreadFilter">Streuung</label>
                                    <select id="distSpreadFilter" onchange="scheduleDist()">
                                        <option value="any">Alle</option>
                                        <option value="tight">Eng</option>
                                        <option value="medium">Mittel</option>
                                        <option value="wide">Weit</option>
                                    </select>
                                </div>
                            </div>
                            <div class="toolbar">
                                <button type="button" class="btn btn-sm" onclick="applyDistPreset('all')">Alle 1–6</button>
                                <button type="button" class="btn btn-sm" onclick="applyDistPreset('no6')">Keine 6</button>
                                <button type="button" class="btn btn-sm" onclick="applyDistPreset('no56')">Keine 5 &amp; 6</button>
                                <button type="button" class="btn btn-sm btn-danger" onclick="applyDistPreset('reset')">Reset</button>
                            </div>
                            <div class="grid-6" id="distCatGrid"></div>
                            <div class="grid-6" id="distExactGrid" style="margin-top:8px;"></div>
                        </div>
                    </details>

                    <div id="distOutput"></div>
                </div>
            </details>
        </section>

        <!-- TAB 3: SCHLÜSSEL & VERGLEICH -->
        <section id="view-tools" class="tab-view">
            <details class="card-panel" open>
                <summary><span>Punkteschlüssel</span></summary>
                <div class="panel-body">
                    <div class="form-grid-3">
                        <div>
                            <label for="keyMaxPts">Maximalpunkte</label>
                            <input type="number" id="keyMaxPts" min="0.5" step="0.5" placeholder="60" oninput="syncKeyFromMax()">
                        </div>
                        <div>
                            <label for="keyGotPts">Eigene Punkte</label>
                            <input type="number" id="keyGotPts" min="0" step="0.5" placeholder="46" oninput="renderKeyTable()">
                        </div>
                        <div class="check-col">
                            <button type="button" class="btn" onclick="resetKeyTable()">Standard</button>
                        </div>
                    </div>
                    <div id="keySummary"></div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Note</th>
                                    <th>Ab %</th>
                                    <th>Ab Punkte</th>
                                    <th>Sperre</th>
                                </tr>
                            </thead>
                            <tbody id="keyTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </details>

            <details class="card-panel">
                <summary><span>Vergleich</span></summary>
                <div class="panel-body">
                    <div class="form-grid-2">
                        <div>
                            <label for="cmpA">Reihe A</label>
                            <input type="text" id="cmpA" placeholder="122334" oninput="updateComparison()">
                        </div>
                        <div>
                            <label for="cmpB">Reihe B</label>
                            <input type="text" id="cmpB" placeholder="223344" oninput="updateComparison()">
                        </div>
                    </div>
                    <div id="cmpOutput"></div>
                </div>
            </details>
        </section>

        <!-- TAB 4: VERLAUF -->
        <section id="view-archive" class="tab-view">
            <details class="card-panel" open>
                <summary><span>Prüfung komplett speichern</span></summary>
                <div class="panel-body">
                    <div class="save-row">
                        <input type="text" id="archiveName" placeholder="Name (z.B. Halbjahr 1)">
                        <button type="button" class="btn btn-primary" onclick="saveFullSnapshot()">Speichern</button>
                    </div>
                </div>
            </details>
            <div id="archiveList"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button type="button" class="nav-btn active" data-tab="subjects" onclick="switchTab('subjects')">
            <span>Fächer</span>
        </button>
        <button type="button" class="nav-btn" data-tab="distribution" onclick="switchTab('distribution')">
            <span>Verteilung</span>
        </button>
        <button type="button" class="nav-btn" data-tab="tools" onclick="switchTab('tools')">
            <span>Schlüssel</span>
        </button>
        <button type="button" class="nav-btn" data-tab="archive" onclick="switchTab('archive')">
            <span>Verlauf</span>
        </button>
    </nav>
</div>

<script src="app.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
    }
</script>
</body>
</html>
